# NOTE : L'image devops-news-front proxifie en dur vers http://backend:5000
# Dans un deploiement Helm, le service backend se nomme {{ include "devops-news.fullname" (dict "root" . "component" "backend") }}.
# Cette limitation devra etre corrigee en passant le nom du backend via une variable
# d'environnement Nginx dans une version future du chart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-news.fullname" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "devops-news.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "devops-news.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devops-news.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.images.repoAccount }}/devops-news-front:{{ .Values.images.tags.frontend }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-news.fullname" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "devops-news.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "devops-news.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
