# Images Docker
images:
  repoAccount: "pueblo2708"
  pullPolicy: IfNotPresent
  tags:
    backend: "latest"
    frontend: "latest"
    cleaner: "latest"

# Backend (API Flask)
backend:
  replicas: 2
  logLevel: "INFO"
  service:
    type: ClusterIP
    port: 5000
  resources: {}
  extraEnv: []
  # Exemple d'utilisation :
  # extraEnv:
  #   - name: FEATURE_FLAG_X
  #     value: "true"
  #   - name: SENTRY_DSN
  #     value: "https://xxx@sentry.io/123"

# Frontend (Nginx)
frontend:
  replicas: 1
  service:
    type: LoadBalancer
    port: 80
  resources:
    limits:
      cpu: "200m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

# Redis (sous-chart Bitnami — voir dependencies dans Chart.yaml)
# Ces valeurs sont transmises au sous-chart sous la cle "redis".
redis:
  # Active/desactive le sous-chart (lu par "condition: redis.enabled").
  enabled: true
  # Instance unique (equivalent de l'ancien StatefulSet a 1 replica).
  architecture: standalone
  auth:
    enabled: true
    password: "supersecret"
  master:
    persistence:
      enabled: true
      size: "1Gi"
      # Vide = StorageClass par defaut du cluster (local: standard/local-path).
      # En prod GKE, surcharge dans values-prod.yaml (standard-rwo).
      storageClass: ""
    service:
      ports:
        redis: 6379

# Cleaner (CronJob)
cleaner:
  enabled: true
  schedule: "*/2 * * * *"
  maxAgeSeconds: 3600
